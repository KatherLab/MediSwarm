# GitGuardian configuration
#
# https://docs.gitguardian.com/ggshield-docs/reference/config
version: 2

secret:
  ignored-paths:
    # Deliberately-outdated NVFlare startup kits used ONLY by the
    # verify_wrong_certificates_are_rejected integration test
    # (scripts/ci/runIntegrationTests.sh). The archive contains RSA private keys
    # and certs, but they are a self-signed throwaway CA whose root CN is
    # literally "odelia_1.0.1-dev.250919.095c1b7_dummy_project_for_testing",
    # issued to CN=client_A / O=Test_Org. They chain only to themselves and
    # authenticate nothing that exists -- no server, no VPN, no registry.
    # Their entire purpose is to be REJECTED: the test starts a client and admin
    # console with these certs against a local test server signed by a different
    # root, and passes only when the server refuses the connection and the client
    # raises SSLCertVerificationError. Real key material, zero blast radius.
    - tests/integration_tests/outdated_startup_kit.tar.gz

    # Disposable easy-rsa material for the throwaway local OpenVPN test container
    # (testserver.local / test.odelia). Regenerated by
    # tests/local_vpn/_openvpn_certificate_creation.sh on every run; the harness
    # README states outright that it must not be re-used.
    - tests/local_vpn/**
