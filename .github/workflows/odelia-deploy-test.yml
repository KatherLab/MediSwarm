name: ODELIA Deploy Test

on:
  workflow_dispatch:     # Manual trigger
  release:
    types: [published]   # Run on every tagged release

permissions:
  contents: read

concurrency:
  group: odelia-deploy-test
  cancel-in-progress: false  # Don't cancel long-running swarm training

jobs:
  deploy-test:
    # Must run on Cosmos — it orchestrates dl0/dl2/dl3 via SSH.
    # dl0, dl2, dl3 are also self-hosted runners but they are the remote
    # *clients* managed by Cosmos, so they must NOT pick up this job.
    # Add the "cosmos" label to the Cosmos runner in:
    #   GitHub → repo Settings → Actions → Runners → Edit
    runs-on: [self-hosted, cosmos]
    timeout-minutes: 1440  # 24 hours (6 models x ~2-4h each)

    steps:
      - name: Clean root-owned files from previous runs
        run: |
          # NVFlare server container creates root-owned workspace files that
          # block actions/checkout@v4's git clean.  Remove them before checkout.
          sudo rm -rf "$GITHUB_WORKSPACE/workspace" "$GITHUB_WORKSPACE/deploy_test" 2>/dev/null || true

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build Docker image + startup kits
        run: |
          ./scripts/build/buildDockerImageAndStartupKits.sh \
            -p application/provision/project_deploy_test_4site.yml \
            --use-docker-cache \
            --num-rounds 1

      - name: Push Docker image to Docker Hub
        run: |
          # Remote clients pull the image from Docker Hub during startup.
          # Cosmos is already authenticated to Docker Hub (jefftud).
          VERSION=$(./scripts/build/getVersionNumber.sh)
          docker push "jefftud/odelia:$VERSION"

      - name: Copy deploy site credentials (gitignored)
        run: |
          # deploy_sites_4node_test.conf contains site passwords and is
          # gitignored, so it doesn't exist in the checkout.  Copy the
          # persistent copy that lives in the dev checkout on Cosmos.
          cp /home/jeff/Projects/MediSwarm/deploy_sites_4node_test.conf .

      - name: Run all 6 models deploy test
        run: |
          ./scripts/deploy/run_deploy_test.sh \
            --all \
            --conf deploy_sites_4node_test.conf

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-test-results
          path: workspace/deploy_test_results/

      - name: Kill orphaned containers (cleanup)
        if: always()
        run: |
          # Stop and remove any lingering containers from this test run
          docker ps --format '{{.Names}}' | grep -E 'odelia|stamp|nvflare' | xargs -r docker kill 2>/dev/null || true
          docker ps -a --format '{{.Names}}' | grep -E 'odelia|stamp|nvflare' | xargs -r docker rm -f 2>/dev/null || true
