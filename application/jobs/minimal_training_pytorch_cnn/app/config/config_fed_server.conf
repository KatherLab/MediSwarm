format_version = 2
task_data_filters = []
task_result_filters = []
components = [
  {
    # write validation results to json file
    id = "json_generator"
    path = "nvflare.app_common.widgets.validation_json_generator.ValidationJsonGenerator"
    args {}
  }
  {
    # Collect the per-site metrics clients already stream (fed.analytix_log_stats)
    # and hand them to json_generator at end of run, so cross_val_results.json is
    # populated instead of {}. See #525 and docs/EVALUATION_PITFALLS.md (E1).
    id = "per_site_metrics"
    path = "per_site_metrics.PerSiteMetricCollector"
    args {}
  }
]
workflows = [
  {
    # server-side controller to manage job life cycle
    id = "swarm_controller"
    path = "nvflare.app_common.ccwf.SwarmServerController"
    args {
      # can also set aggregation clients and train clients, see class for all available args
      num_rounds = 5
      # time to wait for clients to start (30 min — 10 nodes over VPN)
      start_task_timeout = 1800
      # time without progress before timing out (8 hours — 10 nodes with large models)
      progress_timeout = 28800
      # time to wait for configure task (15 min)
      configure_task_timeout = 900
      # maximum interval between status reports (5 min)
      max_status_report_interval = 300
    }
  }
]
