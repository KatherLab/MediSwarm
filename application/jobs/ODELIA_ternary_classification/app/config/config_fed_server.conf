format_version = 2
dead_client_grace_period = 14400.0
task_data_filters = []
task_result_filters = []
components = [
  {
    # write validation results to json file
    id = "json_generator"
    path = "nvflare.app_common.widgets.validation_json_generator.ValidationJsonGenerator"
    args {}
  }
  {
    # Collect the per-site metrics clients already stream (fed.analytix_log_stats)
    # and hand them to json_generator at end of run, so cross_val_results.json is
    # populated instead of {}. See #525 and docs/EVALUATION_PITFALLS.md (E1).
    id = "per_site_metrics"
    path = "per_site_metrics.PerSiteMetricCollector"
    args {}
  }
  {
    # Reassemble per-case rows returned by sites that opted in with
    # ODELIA_RETURN_PER_CASE=1: one file per site, split and model kind,
    # cross_site_val/per_case_predictions/<SITE>__<split>__<model_kind>.csv.
    # Inert when no site opts in, which is the default. See #526, #527, #528.
    id = "per_case_predictions"
    path = "per_case_predictions.PerCasePredictionCollector"
    args {}
  }
  {
    # MS6 (#612): archive of every per-round global, streamed by the clients' ms6_global_streamer
    # (ms6_archive.py). Off by default; the job builder switches both on. Files go to
    # <archive_root>/<job_id>/, or to the run directory (WARNING in the log) when archive_root is not
    # a mount point or not writable. require_mount = false accepts a plain directory (a server that
    # does not run in a container); in a container that directory would be lost with the container.
    id = "ms6_global_archive"
    path = "ms6_archive.MS6GlobalArchive"
    args {
      enabled = false
      archive_root = "/archive"
      require_mount = true
    }
  }
]
workflows = [
  {
    # server-side controller to manage job life cycle
    id = "swarm_controller"
    path = "fault_tolerant_ccwf.FaultTolerantSwarmServerController"
    args {
      # can also set aggregation clients and train clients, see class for all available args
      num_rounds = 20
      min_clients = 5  # FAULT TOLERANCE (#346): keep running while >= this many clients are active; a client that errors is pruned and the run continues. Set to (participating_clients - allowed_failures); 0 = all required (no tolerance). TUNE per run + live-test.
      # time for starting_client to distribute initial model to all sites (4 hours — 1.07 GB x 8 sites over VPN)
      start_task_timeout = 14400
      # max time without any progress before declaring failure (24 hours — slowest site gates each round)
      progress_timeout = 86400
      # time for clients to acknowledge configuration (30 min)
      configure_task_timeout = 1800
      # interval for clients to report status (24 h — a slow site can be silent for hours during a long round)
      max_status_report_interval = 86400
    }
  }
]
