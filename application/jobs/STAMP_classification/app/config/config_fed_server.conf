format_version = 2
task_data_filters = []
task_result_filters = []
components = [
  {
    # write validation results to json file
    id = "json_generator"
    path = "nvflare.app_common.widgets.validation_json_generator.ValidationJsonGenerator"
    args {}
  }
]
workflows = [
  {
    # server-side controller to manage job life cycle
    id = "swarm_controller"
    path = "nvflare.app_common.ccwf.SwarmServerController"
    args {
      # can also set aggregation clients and train clients, see class for all available args
      num_rounds = 20
      # time for clients to configure and start (30 min — 10 nodes over VPN)
      start_task_timeout = 1800
      # max time without any progress (no round finished anywhere) before the server aborts the
      # job (2 h). Must stay below the clients' learn_task_timeout (28800): the stock gatherer
      # aggregates whatever has arrived when that timer runs out, so a site whose training hangs
      # would otherwise yield a silent round without it instead of an abort.
      progress_timeout = 7200
      # time for clients to acknowledge configuration (15 min)
      configure_task_timeout = 900
      # longest silence of one client before the server aborts the job (30 min). Status rides on
      # every task pull, so only a network gap counts. With 300 s, one 5-minute gap at one site
      # (a relayed Tailscale path, a VPN reconnect) aborted a strict run. The server's own
      # heart_beat_timeout (local/resources.json, 600 s by default) still logs a silent client out
      # after about 10 minutes.
      max_status_report_interval = 1800
    }
  }
]
