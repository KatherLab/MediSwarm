api_version: 3
name: decade_2site___REPLACED_BY_CURRENT_VERSION_NUMBER_WHEN_BUILDING_STARTUP_KITS___test
description: >
  DECADE 2-client deploy-test provision (UKB_1, Mainz_1) for validating the STAMP
  pipeline + jefftud/decade image on dl0/dl2 before distributing the real 4-site
  kits. TUD server + admin on Cosmos; no TUD training client. Build with
  Dockerfile_STAMP (produces jefftud/decade:<version>).

participants:
  - name: dl3.tud.de
    type: server
    org: TUD
    fed_learn_port: 8002
    admin_port: 8003
  - name: UKB_1
    type: client
    org: UKB
  - name: Mainz_1
    type: client
    org: Mainz
  - name: jiefu.zhu@tu-dresden.de
    type: admin
    org: TUD
    role: project_admin

builders:
  - path: nvflare.lighter.impl.workspace.WorkspaceBuilder
    args:
      template_file: master_template.yml
  - path: nvflare.lighter.impl.template.TemplateBuilder
  - path: nvflare.lighter.impl.static_file.StaticFileBuilder
    args:
      config_folder: config
      scheme: http
      docker_image: jefftud/decade:__REPLACED_BY_CURRENT_VERSION_NUMBER_WHEN_BUILDING_STARTUP_KITS__
      overseer_agent:
        path: nvflare.ha.dummy_overseer_agent.DummyOverseerAgent
        overseer_exists: false
        args:
          sp_end_point: dl3.tud.de:8002:8003
  - path: nvflare.lighter.impl.cert.CertBuilder
  - path: nvflare.lighter.impl.signature.SignatureBuilder
