api_version: 3
name: odelia_deploy_test___REPLACED_BY_CURRENT_VERSION_NUMBER_WHEN_BUILDING_STARTUP_KITS___model_test
description: ODELIA 2-client deploy test across Tailscale VPN (dl0, dl2; server on Cosmos)

participants:
  - name: dl3.tud.de
    type: server
    org: TUD
    # 8102/8103, NOT 8002/8003. The productive ODELIA server runs on the same host
    # under the same name and binds 8002/8003 with certificates from a different
    # provisioning generation. Sharing the ports means the test server silently
    # fails to bind, the test clients reach the PRODUCTIVE server instead, and they
    # fail with ClientConnectorCertificateError -- which reads exactly like a stale
    # startup kit (F9) and is not one. Same collision DECADE hit and solved the same
    # way; project_MEVIS_test.yml uses 8032/8033 for the same reason.
    fed_learn_port: 8102
    admin_port: 8103
  - name: RUMC_1
    type: client
    org: TUD
  - name: MHA_1
    type: client
    org: TUD
  - name: jiefu.zhu@tu-dresden.de
    type: admin
    org: TUD
    role: project_admin

builders:
  - path: nvflare.lighter.impl.workspace.WorkspaceBuilder
    args:
      template_file: master_template.yml
  - path: nvflare.lighter.impl.template.TemplateBuilder
  - path: nvflare.lighter.impl.static_file.StaticFileBuilder
    args:
      config_folder: config
      scheme: http
      docker_image: jefftud/odelia:__REPLACED_BY_CURRENT_VERSION_NUMBER_WHEN_BUILDING_STARTUP_KITS__
      overseer_agent:
        path: nvflare.ha.dummy_overseer_agent.DummyOverseerAgent
        overseer_exists: false
        args:
          sp_end_point: dl3.tud.de:8002:8003
  - path: nvflare.lighter.impl.cert.CertBuilder
  - path: nvflare.lighter.impl.signature.SignatureBuilder
